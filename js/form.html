<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
        <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div class="max-w-[100%]">
        <div class="flex flex-col justify-center items-center h-screen">
            <div class="bg-[#000000b4] p-20 text-center space-y-10 rounded-lg shadow-lg">
                <h1 class="text-4xl text-white">Login</h1>
                <form action="" id="login" class="flex flex-col justify-center items-center gap-5">
                    <input type="text" name="" id="email" class="border px-5 rounded-lg py-2" placeholder="enter your email">
                    <p class="text-red-500" id="emailErr"></p>
                    <input type="password" name="" id="password" class="border px-5 py-2 rounded-lg" placeholder="enter your password">
                    <p class="text-red-500" id="passErr"></p>
                    <button class="bg-green-500 px-5 py-2 rounded-lg text-white" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script src="./form.js"></script>
</html>
